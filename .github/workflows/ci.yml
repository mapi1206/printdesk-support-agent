name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B -f backend/pom.xml verify
      - name: Smoke test the server
        run: |
          java -jar backend/target/printdesk.jar &
          for i in $(seq 1 20); do curl -sf localhost:8080/api/health && break; sleep 1; done
          curl -sf "localhost:8080/api/parts?printer=p1s&cat=hotend" | head -c 200

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate data and check it is up to date
        run: |
          pip install openpyxl
          cd data && python generate.py
          git diff --stat --exit-code -- data.json
