    const {text}=await sample(prompt,{modelTier:"quick",signal:ctl.signal,cache:{gcTime:6*36e5},onText:({text})=>{S.partAi[key]={busy:true,text};if(S.partView?.id===v.id)renderModal();}});
    S.partAi[key]={text};
  }catch(e){ S.partAi[key]=e?.code==="cancelled"?{text:e.text||""}:{err:errCopy(e),text:e?.text||""}; }
  S.partAiCtl=null; if(S.partView?.id===v.id) renderModal();
}

/* ============================================================ events */
document.addEventListener("click", e=>{
  if(e.target.closest("[data-mclose]")){ e.preventDefault(); closePart(); return; }
  const al=e.target.closest("[data-altpart]"); if(al){ e.preventDefault(); const v=S.partView; S.partView={...v,id:al.dataset.altpart,why:""}; renderModal(); $("#modal .mpanel")?.scrollTo?.(0,0); return; }
  if(e.target.closest("button,a,input,select,textarea")) return;
  const card=e.target.closest("[data-part]"); if(card) openPart(card.dataset.part, card.dataset.why);
});
document.addEventListener("click", async e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(d.view){S.view=d.view;try{localStorage.setItem("pd-view",d.view)}catch(_){}render();return;}
  if(d.lang){UI=d.lang;try{localStorage.setItem("pd-lang",UI)}catch(_){}render();return;}
  if(d.cprinter){S.printer=S.printer===d.cprinter?null:d.cprinter;try{localStorage.setItem("pd-printer",S.printer||"")}catch(_){} if(S.kase&&!S.kase.problem)S.kase.printer=S.printer;render();return;}
  if(d.example){sendChat(d.example);return;}
  if(d.ask){sendChat(`${P(S.printer).name}: ${PROB(d.ask)[UI]}`);return;}
  if(d.fix){markFixed(d.fix);return;}
  if(d.tried){markTried(d.tried);return;}
  if(d.star){
    const v=+d.v;
    if(d.star==="cust"&&S.kase){S.kase.customer_rating=v;render();if(await saveCase(S.kase))upsertLive(S.kase);}
    else { const k=outcomeCase(); if(k){k._dirty=true;if(d.star==="ai")k.support_rating=v;else k.customer_rating=v;render();} }
    return;
  }
  if(d.sup){S.sup.tab=d.sup;render();return;}
  if(d.sprinter){S.sup.printer=S.sup.printer===d.sprinter?null:d.sprinter;if(S.sup.problem&&S.sup.printer&&!PROB(S.sup.problem).printers.includes(S.sup.printer))S.sup.problem=null;render();return;}
  if(d.sprob){S.sup.problem=d.sprob;render();return;}
  if(d.psolve!==undefined){logPhone(+d.psolve);return;}
  if(d.ticket){S.sup.ticket=d.ticket;render();const dt=document.querySelector(".inbox > section:last-child");if(dt&&innerWidth<900)dt.scrollIntoView({behavior:"smooth",block:"start"});return;}
  if(d.tfilter){S.sup.filter=d.tfilter;render();return;}
  if(d.mbox){S.sup.mbox=d.mbox;render();return;}
  if(d.asgfilter!==undefined){S.sup.asg=S.sup.asg===d.asgfilter?"":d.asgfilter;render();return;}
  if(d.kbopen){S.kb.open=S.kb.open===d.kbopen?null:d.kbopen;render();return;}
  if(d.kbform){S.kb.form=d.kbform;S.kb.prefill="";render();return;}
  if(d.kbfromcase){S.kb.open=d.kbfromcase;S.kb.form=d.kbfromcase;S.kb.prefill=d.text||"";render();return;}
  if(d.kbok){kbReview(d.kbok,true);return;}
  if(d.kbno){kbReview(d.kbno,false);return;}
  if(d.mdel!==undefined){const i=+d.mdel; if(S.mDel===i){S.mDel=null; const members=TEAM.members.filter((_,j)=>j!==i); if(await saveSetting("team",{...TEAM,members})) {TEAM.members=members; render();}} else {S.mDel=i; toast(t("mbDelAgain"));} return;}
  if(d.mbdel!==undefined){const i=+d.mbdel; if(S.sup.mbDelConfirm===i){S.sup.mbDelConfirm=null;await saveMailboxes(MAILBOXES.filter((_,j)=>j!==i));}else{S.sup.mbDelConfirm=i;toast(t("mbDelAgain"));render();setTimeout(()=>{if(S.sup.mbDelConfirm===i){S.sup.mbDelConfirm=null;render();}},4000);}return;}
  if(d.oprinter){S.off.printer=S.off.printer===d.oprinter?null:d.oprinter;if(S.off.printer&&!D.parts.some(p=>p.cat===S.off.cat&&p.compat.includes(S.off.printer)))S.off.cat="hotend";render();return;}
  if(d.ocat){S.off.cat=d.ocat;render();return;}
  if(d.oprio){S.off.prio=d.oprio;render();return;}
  if(d.insrc){S.ins.src=d.insrc;render();return;}
  switch(d.act){
    case "newchat": S.convo=[];S.turns=[];S.kase=null;S.pending=[];render();break;
    case "stop": S.busy?.ctl?.abort();break;
    case "escalate": await escalate("Customer: nothing worked");break;
    case "savecase": saveOutcome(); break;
    case "addnote": { const tk=curTicket(), v=($("#notein")?.value||"").trim(); if(tk&&v){ await putTicket(tk,{notes:[...(tk.notes||[]),{by:meMember()?.name||"",by_id:meId()||null,at:Date.now(),text:v.slice(0,2000)}]}); render(); } break; }
    case "photoopen": S.sup.photoOpen=true; render(); break;
    case "reanalyze": { const tk=curTicket(); if(tk){ await putTicket(tk,{status:"new"}); S.triedIds.delete(tk.id); S.autoOff=false; autoTriage(); render(); } break; }
    case "kbnewprob": S.kb.newProb=!S.kb.newProb; render(); break;
    case "kbcancel": S.kb.form=null; S.kb.newProb=false; S.kb.prefill=""; render(); break;
    case "kbsubmitstep": { const en=$("#kbsen").value.trim(), de=$("#kbsde").value.trim(); if(!en&&!de){toast(t("emptyBody"));break;} kbPropose({type:"step",problem_id:b.dataset.pid,step_en:en||de,step_de:de||en,part_cat:$("#kbpart").value||null}); break; }
    case "kbsubmitprob": { const en=$("#kbpen").value.trim(), de=$("#kbpde").value.trim(), se=$("#kbsen").value.trim(), sd=$("#kbsde").value.trim(); if(!(en||de)||!(se||sd)){toast(t("emptyBody"));break;}
      kbPropose({type:"problem",en:en||de,de:de||en,kw:$("#kbkw").value.trim(),cat:$("#kbcat").value,step_en:se||sd,step_de:sd||se,part_cat:$("#kbpart").value||null}); break; }
    case "maddmember": { const name=$("#mname").value.trim(); if(!name){toast(t("emptyBody"));break;}
      const m={id:"m"+Date.now().toString(36),name:name.slice(0,60),email:$("#memail").value.trim().slice(0,120),langs:$("#mlangs").value.toLowerCase().split(/[\s,;]+/).filter(x=>/^[a-z]{2}$/.test(x)),role:$("#mrole").value,active:true};
      const members=[...TEAM.members,m]; if(await saveSetting("team",{...TEAM,members})){TEAM.members=members; if(!meId()) setMe(m.id); render();} break; }
    case "saveteam": { const n=Math.max(0,Math.min(200,parseInt($("#mindaily").value,10)||0)); const nt={...TEAM,min_daily:n,auto:$("#autoasg").checked}; if(await saveSetting("team",nt)){TEAM=nt;render();} break; }
    case "savestyle": { const st={tone:$("#stone").value,signature:$("#ssig").value.slice(0,600),include:$("#sinc").value.slice(0,600),avoid:$("#savoid").value.slice(0,600)}; if(await saveSetting("style",st)){STYLE=st;render();} break; }
    case "savesum": { const v=$("#sumto").value.trim(); if(v&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){toast(t("badEmail"));break;} const c={...SUMCFG,to:v,hour:Math.max(0,Math.min(23,parseInt($("#sumhour").value,10)||8)),auto:$("#sumauto").checked}; if(await saveSetting("summary",c)){SUMCFG=c;render();} break; }
    case "sumpreview": S.sumPrev=buildSummary(); render(); break;
    case "sumsend": await sendSummary(false); render(); break;
    case "sumcopy": copyText(S.sumPrev.subject+"\n\n"+S.sumPrev.text,b); break;
    case "partai": explainPart(); break;
    case "partaistop": S.partAiCtl?.abort(); break;
    case "closeticket": { const tk=curTicket(); if(tk) closeTicket(tk,true); break; }
    case "closesolved": { const tk=curTicket(); if(tk) closeTicket(tk,false); break; }
    case "addreply": { const tk=curTicket(), v=($("#custreply")?.value||"").trim(); if(tk&&v){ await addCustomerReply(tk,[{dir:"in",at:Date.now(),from:tk.from_email,from_name:tk.from_name,body:v,message_id:null}]); render(); autoTriage(); } break; }
    case "newmail": S.sup.compose=!S.sup.compose; render(); break;
    case "cancelmail": S.sup.compose=false; render(); break;
    case "createmail": {
      const body=$("#nmbody").value.trim(), mail=$("#nmmail").value.trim();
      if(!body){toast(t("emptyBody"));break;}
      if(mail&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){toast(t("badEmail"));break;}
      S.sup.compose=false; await addTickets([{source:"email",mailbox:$("#nmbox")?.value||null,from_name:$("#nmname").value.trim(),from_email:mail,subject:$("#nmsubj").value.trim(),body}]); break; }
    case "demoinbox": await loadDemoOnce(); break;
    case "cleardemo": if(S.confirm==="cleardemo"){ S.confirm=null; await clearDemo(); } else { S.confirm="cleardemo"; render(); setTimeout(()=>{ if(S.confirm==="cleardemo"){ S.confirm=null; render(); } },5000); } break;
    case "deltk": { const tk=curTicket(); if(!tk) break; if(S.confirm==="deltk:"+tk.id){ S.confirm=null; await deleteTicket(tk); } else { S.confirm="deltk:"+tk.id; render(); setTimeout(()=>{ if(S.confirm==="deltk:"+tk.id){ S.confirm=null; render(); } },5000); } break; }
    case "anontk": { const tk=curTicket(); if(tk&&await anonymizeTicket(tk)){ toast(t("anonDone")); render(); } break; }
    case "notspam": { const tk=curTicket(); if(tk){ await putTicket(tk,{status:"new",force_support:true,filter_reason:null}); S.triedIds.delete(tk.id); S.autoOff=false; autoTriage(); render(); } break; }
    case "savepriv": { const p={...PRIV,retention_days:Math.max(1,Math.min(3650,parseInt($("#retdays").value,10)||90)),auto:$("#privauto").checked}; if(await saveSetting("privacy",p)){PRIV=p;render();} break; }
    case "runpriv": await runRetention(true); render(); break;
    case "savealert": { const a={on:$("#alerton").checked,levels:$("#alertlvl").value.split(",")}; if(await saveSetting("alerts",a)){ALERTCFG=a;render();checkOverdue();} break; }
    case "fetchmail": checkMailNow(); break;
    case "mbopen": S.sup.mbAdd=true; render(); break;
    case "mbcancel": S.sup.mbAdd=false; render(); break;
    case "mbadd": { const v=$("#mbaddr").value.trim().toLowerCase(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){toast(t("badEmail"));break;} if(MAILBOXES.some(m=>m.addr.toLowerCase()===v)){toast(t("mbDup"));break;}
      const kind=$("#mbkind").value, owner=$("#mbowner").value.trim().slice(0,60);
      S.sup.mbAdd=false; await saveMailboxes([...MAILBOXES,{addr:v,kind,owner,boost:kind==="personal"?10:0}]); checkMailNow(); break; }
    case "autoon": S.autoOff=false; S.triedIds.clear(); autoTriage(); render(); break;
    case "triage": { const tk=curTicket(); if(tk){ S.autoOff=false; S.triedIds.delete(tk.id); triageTicket(tk);} break; }
    case "stoptriage": S.tctl?.abort(); break;
    case "approve": { const tk=curTicket(); if(tk) approveTicket(tk); break; }
    case "unapprove": { const tk=curTicket(); if(tk){ await putTicket(tk,{status:"ready"}); S.sendErr=null; render(); } break; }
    case "send": { const tk=curTicket(); if(tk) sendTicket(tk); break; }
    case "rewrite": { const tk=curTicket(); if(tk) rewriteDraft(tk,$("#rwinst").value); break; }
    case "translate": { const tk=curTicket(); if(tk) translateDraft(tk); break; }
    case "copyreply": { const tk=curTicket(); if(tk){ const d=draftOf(tk); copyText(d.subject+"\n\n"+d.body,b);} break; }
    case "closenoreply": { const tk=curTicket(); if(tk){ await putTicket(tk,{status:"closed",closed_at:Date.now()}); render(); } break; }
    case "reopen": { const tk=curTicket(); if(tk){ await putTicket(tk,{status:tk.triage&&!tk.triage.customer_confirms_fixed?"ready":"new"}); render(); } break; }
    case "setmail": { const tk=curTicket(), v=$("#setmail").value.trim(); if(tk&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ await putTicket(tk,{from_email:v}); render(); } else toast(t("badEmail")); break; }
    case "escmail": { const v=$("#escmail").value.trim(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){toast(t("badEmail"));break;} const tk=tickets.find(x=>x.id===S.kase?._ui?.ticketId); if(tk){ await putTicket(tk,{from_email:v}); S.kase._ui.mailSaved=true; render(); } break; }
  }
});
document.addEventListener("submit",e=>{if(e.target.id==="chatform"){e.preventDefault();const v=$("#chatin").value;$("#chatin").value="";S.draft="";sendChat(v);}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.partView){ closePart(); return; }
  if((e.key==="Enter"||e.key===" ")&&e.target.matches?.("[data-part]")){ e.preventDefault(); openPart(e.target.dataset.part,e.target.dataset.why); return; }
  if(e.key==="Tab"&&S.partView){ const f=[...document.querySelectorAll("#modal button,#modal a")]; if(f.length){ const i=f.indexOf(document.activeElement); if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus();} else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus();} } }
});
document.addEventListener("keydown",e=>{if(e.target.id==="chatin"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#chatform").requestSubmit();}});
document.addEventListener("input",e=>{
  if(e.target.id==="sq"){S.sup.q=e.target.value;$("#probchips").innerHTML=probChips();}
  if(e.target.id==="kbq"){S.kb.q=e.target.value;$("#kblist").innerHTML=kbList();}
  if(e.target.id==="dsubj"||e.target.id==="dbody"){const tk=curTicket(); if(tk){S.edits[tk.id]={...(S.edits[tk.id]||{}),[e.target.id==="dsubj"?"subject":"body"]:e.target.value};}}
  if(e.target.id==="oother"){const k=outcomeCase(); if(k){k.custom_fix=e.target.value;k._dirty=true;}}
});
document.addEventListener("change",e=>{
  if(e.target.id==="osolved"){const w=$("#otherwrap");if(w)w.hidden=e.target.value!=="other";
    const k=outcomeCase(), v=e.target.value; if(k){k._dirty=true;k.resolved=v!=="none"; k.solved_step=/^\d+$/.test(v)?+v:null; if(v!=="other") k.custom_fix=null; else k.custom_fix=k.custom_fix||"";}}
  if(e.target.id==="insprob"){S.ins.problem=e.target.value;render();}
  if(e.target.id==="iam"){setMe(e.target.value);render();}
  if(e.target.id==="asgsel"){const tk=curTicket(); if(tk) putTicket(tk,{assignee:e.target.value||null,assign_reason:e.target.value?t("asgManual")+(meMember()?" · "+meMember().name:""):"",assigned_at:Date.now()}).then(render);}
  if(e.target.id==="photoin"){const tk=curTicket(); if(tk){[...e.target.files].slice(0,imgMax).forEach(f=>addImg(tk.id,f,f.name)); S.sup.photoOpen=true; render();}}
  if(e.target.id==="chatphoto"){[...e.target.files].slice(0,imgMax).forEach(f=>S.chatImgs.push(f)); render();}
});

/* ============================================================ boot */
(async function boot(){
  try{ D=await (await fetch("data.json")).json(); }
  catch(e){ $("#app").innerHTML=`<p class="empty">Could not load the catalog (data.json).</p>`; return; }
  if(S.printer&&!P(S.printer)) S.printer=null;
  applyKB();
  render();
  if(!window.claude) return;
  claude.use("sample").then(async s=>{ sample=s; if(s){ try{const l=await s.limits(); toolsOK=!!l.tools; imgOK=!!l.images; if(l.images) imgMax=Math.min(4,l.images.maxCount||4);}catch(_){toolsOK=false;} } render(); });
  setInterval(()=>{ maybeAutoSummary(); checkOverdue(); if(S.view==="support") render(); },5*60*1000);
  claude.use("mcp").then(m=>initMail(m)).catch(()=>{});
  claude.use("db").then(d=>{
    db=d; if(!d) return;
    d.doc("settings/mailboxes").onSnapshot(snap=>{
      const list=snap.exists&&Array.isArray(snap.data().list)?snap.data().list.filter(m=>m&&m.addr):[];
      if(!snap.exists&&!snap.metadata.fromCache){ let old=""; try{old=(localStorage.getItem("pd-support-addr")||"").trim();}catch(_){} if(old){ saveMailboxes([{addr:old.toLowerCase(),kind:"general",owner:"",boost:0}]); return; } }
      MAILBOXES=list.map(m=>({...m})); MAIL.seen.clear(); startMailWatch(); render();
    }, err=>console.warn("db settings",err));
    const setDoc=(name,fn)=>d.doc("settings/"+name).onSnapshot(sn=>{ if(sn.exists) fn(sn.data()); render(); maybeAutoSummary(); },err=>console.warn("db "+name,err));
    setDoc("team",x=>{TEAM={members:Array.isArray(x.members)?x.members:[],min_daily:Number.isFinite(x.min_daily)?x.min_daily:5,auto:x.auto!==false};});
    setDoc("style",x=>{STYLE={tone:x.tone||"friendly",signature:x.signature||"",include:x.include||"",avoid:x.avoid||""};});
    setDoc("privacy",x=>{PRIV={retention_days:Number.isFinite(x.retention_days)?x.retention_days:90,auto:x.auto!==false,last_run:x.last_run||null};});
    setDoc("alerts",x=>{ALERTCFG={on:!!x.on,levels:Array.isArray(x.levels)&&x.levels.length?x.levels:["P1"]};});
    setDoc("summary",x=>{SUMCFG={to:x.to||"",hour:Number.isFinite(x.hour)?x.hour:8,auto:!!x.auto,last:x.last||null};});
    d.collection("kb").onSnapshot(snap=>{ KB=snap.docs.map(x=>({...x.data()})); applyKB(); render(); },err=>console.warn("db kb",err));
    d.collection("tickets").onSnapshot(snap=>{ tickets=snap.docs.map(x=>({...x.data()})); S.ticketsLoaded=true; render(); autoTriage(); maybeAutoSummary(); runRetention(false); checkOverdue(); }, err=>{ console.warn("db tickets",err); });
    d.collection("cases").onSnapshot(snap=>{ live=snap.docs.map(x=>{const nd=x.data();const old=live.find(o=>o.id===nd.id);return old&&old._dirty?old:{...nd};}); render(); }, err=>{ console.warn("db",err); });
  });
})();
</script>
